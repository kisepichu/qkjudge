[package]
name = "qkjudge"
version = "0.1.1"
edition = "2021"
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-cors = "0.7.2"
actix-rt = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
actix-identity = "0.4"
env_logger = "0.11"
log = "0.4.17"
serde = { version = "^1.0.101", features = ["derive"] } # json に serialize, deserialize するやつ
serde_json = "1.0.85"
sqlx = { version = "0.9", default-features = false, features = ["macros", "runtime-tokio", "tls-native-tls", "mysql", "time"] }
bcrypt = "0.19.3"
rand = "0.8.6"
reqwest = { version = "0.12", features = ["json"] }
yaml-rust2 = "0.13"
time = { version = "0.3.47", features = ["serde"] }
hmac = "0.12.1"
sha2 = "0.10.5"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"
